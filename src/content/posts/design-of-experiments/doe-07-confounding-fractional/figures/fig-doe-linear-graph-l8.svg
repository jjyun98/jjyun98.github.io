<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>직교배열표 L8의 두 가지 표준 선점도</title>
  <rect x="0" y="0" width="700" height="300" rx="12" fill="#ffffff"/>
  <!-- (1) 삼각형 -->
  <g transform="translate(40,0)">
    <text x="140" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">(1) 삼각형</text>
    <path d="M140 70 L50 220 L230 220 Z" fill="none" stroke="#1971c2" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#1e1e1e" stroke-width="2"><circle cx="140" cy="70" r="15"/><circle cx="50" cy="220" r="15"/><circle cx="230" cy="220" r="15"/><circle cx="270" cy="100" r="15"/></g>
    <g font-size="15" fill="#1e1e1e" text-anchor="middle"><text x="140" y="75">1</text><text x="50" y="225">2</text><text x="230" y="225">4</text><text x="270" y="105">7</text></g>
    <g font-size="15" fill="#1971c2" font-weight="600" text-anchor="middle"><text x="80" y="142">3</text><text x="202" y="142">5</text><text x="140" y="244">6</text></g>
    <text x="140" y="280" text-anchor="middle" font-size="13" fill="#495057">점 3개와 그 교호작용 3개, 독립 인자 1개</text>
  </g>
  <!-- (2) 별 -->
  <g transform="translate(370,0)">
    <text x="140" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">(2) 별</text>
    <path d="M140 150 L140 70 M140 150 L55 215 M140 150 L225 215" fill="none" stroke="#1971c2" stroke-width="3" stroke-linecap="round"/>
    <g fill="#ffffff" stroke="#1e1e1e" stroke-width="2"><circle cx="140" cy="150" r="15"/><circle cx="140" cy="70" r="15"/><circle cx="55" cy="215" r="15"/><circle cx="225" cy="215" r="15"/></g>
    <g font-size="15" fill="#1e1e1e" text-anchor="middle"><text x="140" y="155">1</text><text x="140" y="75">2</text><text x="55" y="220">4</text><text x="225" y="220">6</text></g>
    <g font-size="15" fill="#1971c2" font-weight="600" text-anchor="middle"><text x="156" y="114">3</text><text x="86" y="174">5</text><text x="196" y="174">7</text></g>
    <text x="140" y="280" text-anchor="middle" font-size="13" fill="#495057">한 인자(1열)와 교호작용하는 인자 3개</text>
  </g>
</svg>
