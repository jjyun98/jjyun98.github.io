<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" width="760" height="425" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>3² 요인실험의 9개 처리조합을 AB 성분과 AB² 성분의 합동식 값으로 나눈 그림</title>
  <rect x="0" y="0" width="760" height="425" rx="12" fill="#ffffff"/>
  <g transform="translate(20,0)">
    <text x="150" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">(a) AB 성분</text>
    <g transform="translate(0,25)">
    <path d="M60 255 L280 255 M60 255 L60 45" fill="none" stroke="#495057" stroke-width="1.5"/>
    <text x="80" y="276" text-anchor="middle" font-size="13" fill="#495057">0</text>
    <text x="44" y="240" text-anchor="middle" font-size="13" fill="#495057">0</text>
    <text x="170" y="276" text-anchor="middle" font-size="13" fill="#495057">1</text>
    <text x="44" y="150" text-anchor="middle" font-size="13" fill="#495057">1</text>
    <text x="260" y="276" text-anchor="middle" font-size="13" fill="#495057">2</text>
    <text x="44" y="60" text-anchor="middle" font-size="13" fill="#495057">2</text>
    <text x="170" y="298" text-anchor="middle" font-size="13" fill="#495057">A의 수준</text>
    <text x="22" y="150" text-anchor="middle" font-size="13" fill="#495057" transform="rotate(-90 22 150)">B의 수준</text>
    <circle cx="80" cy="235" r="22" fill="#1971c2"/>
    <text x="80" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">00</text>
    <circle cx="80" cy="145" r="22" fill="#e03131"/>
    <text x="80" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">01</text>
    <circle cx="80" cy="55" r="22" fill="#2f9e44"/>
    <text x="80" y="60" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">02</text>
    <circle cx="170" cy="235" r="22" fill="#e03131"/>
    <text x="170" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">10</text>
    <circle cx="170" cy="145" r="22" fill="#2f9e44"/>
    <text x="170" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">11</text>
    <circle cx="170" cy="55" r="22" fill="#1971c2"/>
    <text x="170" y="60" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">12</text>
    <circle cx="260" cy="235" r="22" fill="#2f9e44"/>
    <text x="260" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">20</text>
    <circle cx="260" cy="145" r="22" fill="#1971c2"/>
    <text x="260" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">21</text>
    <circle cx="260" cy="55" r="22" fill="#e03131"/>
    <text x="260" y="60" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">22</text>
    <text x="170" y="326" text-anchor="middle" font-size="14" fill="#1e1e1e">L = x_A + x_B (mod 3)</text>
    </g>
  </g>
  <g transform="translate(370,0)">
    <text x="150" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1e1e">(b) AB² 성분</text>
    <g transform="translate(0,25)">
    <path d="M60 255 L280 255 M60 255 L60 45" fill="none" stroke="#495057" stroke-width="1.5"/>
    <text x="80" y="276" text-anchor="middle" font-size="13" fill="#495057">0</text>
    <text x="44" y="240" text-anchor="middle" font-size="13" fill="#495057">0</text>
    <text x="170" y="276" text-anchor="middle" font-size="13" fill="#495057">1</text>
    <text x="44" y="150" text-anchor="middle" font-size="13" fill="#495057">1</text>
    <text x="260" y="276" text-anchor="middle" font-size="13" fill="#495057">2</text>
    <text x="44" y="60" text-anchor="middle" font-size="13" fill="#495057">2</text>
    <text x="170" y="298" text-anchor="middle" font-size="13" fill="#495057">A의 수준</text>
    <text x="22" y="150" text-anchor="middle" font-size="13" fill="#495057" transform="rotate(-90 22 150)">B의 수준</text>
    <circle cx="80" cy="235" r="22" fill="#1971c2"/>
    <text x="80" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">00</text>
    <circle cx="80" cy="145" r="22" fill="#2f9e44"/>
    <text x="80" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">01</text>
    <circle cx="80" cy="55" r="22" fill="#e03131"/>
    <text x="80" y="60" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">02</text>
    <circle cx="170" cy="235" r="22" fill="#e03131"/>
    <text x="170" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">10</text>
    <circle cx="170" cy="145" r="22" fill="#1971c2"/>
    <text x="170" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">11</text>
    <circle cx="170" cy="55" r="22" fill="#2f9e44"/>
    <text x="170" y="60" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">12</text>
    <circle cx="260" cy="235" r="22" fill="#2f9e44"/>
    <text x="260" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">20</text>
    <circle cx="260" cy="145" r="22" fill="#e03131"/>
    <text x="260" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">21</text>
    <circle cx="260" cy="55" r="22" fill="#1971c2"/>
    <text x="260" y="60" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">22</text>
    <text x="170" y="326" text-anchor="middle" font-size="14" fill="#1e1e1e">L = x_A + 2x_B (mod 3)</text>
    </g>
  </g>
  <g font-size="13" fill="#1e1e1e" transform="translate(0,30)">
    <circle cx="200" cy="364" r="8" fill="#1971c2"/><text x="214" y="369">L = 0</text>
    <circle cx="290" cy="364" r="8" fill="#e03131"/><text x="304" y="369">L = 1</text>
    <circle cx="380" cy="364" r="8" fill="#2f9e44"/><text x="394" y="369">L = 2</text>
    <text x="470" y="369" fill="#495057">같은 색 셋이 한 그룹(자유도 2)</text>
  </g>
</svg>
